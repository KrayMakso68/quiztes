<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="telecomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="100%" stop-color="#0dcaf0" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="50%" stop-color="#20c997" />
      <stop offset="100%" stop-color="#0dcaf0" />
    </linearGradient>
  </defs>
  
  <!-- Outer subtle circle -->
  <circle cx="50" cy="50" r="47" fill="#f8faff" stroke="url(#telecomGrad)" stroke-width="2.5" />
  
  <!-- Radiating signal waves (left) -->
  <path d="M 37 30 A 18 18 0 0 0 37 50" fill="none" stroke="url(#telecomGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 30 23 A 28 28 0 0 0 30 57" fill="none" stroke="url(#telecomGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  
  <!-- Radiating signal waves (right) -->
  <path d="M 63 30 A 18 18 0 0 1 63 50" fill="none" stroke="url(#telecomGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 70 23 A 28 28 0 0 1 70 57" fill="none" stroke="url(#telecomGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Antenna Mast -->
  <circle cx="50" cy="40" r="4.5" fill="#0d6efd" />
  <path d="M 50 44 L 50 72" stroke="#0d6efd" stroke-width="3" stroke-linecap="round" />
  <path d="M 40 72 L 50 54 L 60 72" stroke="#0d6efd" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="43" y1="65" x2="57" y2="65" stroke="#0d6efd" stroke-width="2.2" />
  
  <!-- Transmitter Beacon Pulse -->
  <circle cx="50" cy="27" r="2.8" fill="#20c997" />
  <line x1="50" y1="30" x2="50" y2="36" stroke="#20c997" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Signal Sine wave across bottom -->
  <path d="M 16 80 Q 28 68 40 80 T 64 80 T 88 80" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" />
</svg>
